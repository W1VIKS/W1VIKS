<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="170">
  <defs>
    <!-- Deep Space Background Gradient -->
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060712"/>
      <stop offset="50%" stop-color="#0e1026"/>
      <stop offset="100%" stop-color="#180a29"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Saber Gradients -->
    <linearGradient id="saberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="saberPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#BD00FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BD00FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes drift1 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(8px, -5px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes drift2 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(-6px, 6px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes twinkle1 {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes twinkle2 {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.2; }
    }
    @keyframes subtlePulse {
      0%, 100% { stroke: #00E5FF; }
      50% { stroke: #BD00FF; }
    }

    .drift-layer-1 {
      animation: drift1 10s ease-in-out infinite;
    }
    .drift-layer-2 {
      animation: drift2 14s ease-in-out infinite;
    }
    .twinkle-fast {
      animation: twinkle1 3s ease-in-out infinite;
    }
    .twinkle-slow {
      animation: twinkle2 5s ease-in-out infinite;
    }
    .hud-glow {
      animation: subtlePulse 8s ease-in-out infinite;
    }

    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      font-size: 50px;
      letter-spacing: 7px;
      fill: #FFFFFF;
    }
    .subtitle {
      font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 7px;
      fill: #C084FC;
    }
    .tech-tag {
      font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;
      font-size: 11px;
      fill: #00E5FF;
      letter-spacing: 2px;
      opacity: 0.85;
    }
    .star { fill: #ffffff; opacity: 0.55; }
    .star-bright { fill: #00E5FF; opacity: 0.85; }
    .star-purple { fill: #BD00FF; opacity: 0.8; }
  </style>

  <!-- Background Sci-Fi Chamfered Frame -->
  <path d="M 35,8 L 865,8 L 892,35 L 892,135 L 865,162 L 35,162 L 8,135 L 8,35 Z" fill="url(#spaceGrad)" stroke="#242347" stroke-width="1.5"/>

  <!-- Neon Corner Brackets with subtle color transitions -->
  <path d="M 8,50 L 8,35 L 35,8 L 55,8" fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#subtleGlow)"/>
  <path d="M 845,8 L 865,8 L 892,35 L 892,50" fill="none" stroke="#BD00FF" stroke-width="3" filter="url(#subtleGlow)"/>
  <path d="M 892,120 L 892,135 L 865,162 L 845,162" fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#subtleGlow)"/>
  <path d="M 55,162 L 35,162 L 8,135 L 8,120" fill="none" stroke="#BD00FF" stroke-width="3" filter="url(#subtleGlow)"/>

  <!-- Star Layer 1: Slow Drift Right-Up -->
  <g class="drift-layer-1">
    <circle cx="75" cy="45" r="1.5" class="star twinkle-fast"/>
    <circle cx="140" cy="115" r="1.2" class="star"/>
    <circle cx="220" cy="52" r="2" class="star-bright twinkle-slow"/>
    <circle cx="320" cy="138" r="1.4" class="star"/>
    <circle cx="440" cy="30" r="1.3" class="star twinkle-fast"/>
    <circle cx="580" cy="145" r="1.6" class="star-purple twinkle-slow"/>
    <circle cx="710" cy="45" r="2" class="star-bright twinkle-fast"/>
    <circle cx="790" cy="122" r="1.2" class="star"/>
    <circle cx="845" cy="70" r="1.4" class="star twinkle-slow"/>
  </g>

  <!-- Star Layer 2: Slow Drift Left-Down -->
  <g class="drift-layer-2">
    <circle cx="105" cy="90" r="1" class="star-purple twinkle-slow"/>
    <circle cx="190" cy="140" r="1.6" class="star twinkle-fast"/>
    <circle cx="270" cy="38" r="1.2" class="star"/>
    <circle cx="380" cy="155" r="1.5" class="star-bright twinkle-slow"/>
    <circle cx="510" cy="35" r="1.8" class="star twinkle-fast"/>
    <circle cx="640" cy="65" r="1.2" class="star"/>
    <circle cx="740" cy="140" r="1.7" class="star-purple twinkle-fast"/>
    <circle cx="820" cy="105" r="1" class="star twinkle-slow"/>
    <circle cx="50" cy="130" r="1.3" class="star"/>
  </g>

  <!-- Top HUD telemetry -->
  <text x="55" y="28" class="tech-tag">[STATUS: ONLINE]</text>
  <text x="845" y="28" text-anchor="end" class="tech-tag">[SYSTEM: JAVA-CORE]</text>

  <!-- Title: W1VIKS -->
  <text x="450" y="88" text-anchor="middle" class="title" filter="url(#neonGlow)">W1VIKS</text>

  <!-- Lightsaber Energy Clash Divider -->
  <line x1="230" y1="116" x2="443" y2="116" stroke="url(#saberCyan)" stroke-width="2.5" filter="url(#neonGlow)"/>
  <circle cx="450" cy="116" r="3.5" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <line x1="457" y1="116" x2="670" y2="116" stroke="url(#saberPurple)" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- Subtitle -->
  <text x="450" y="146" text-anchor="middle" class="subtitle">✦ VIBE LOVELACE ✦</text>
</svg>